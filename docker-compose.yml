# Zmienne ${...} Compose czyta automatycznie z pliku .env w katalogu projektu.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Tylko 127.0.0.1: baza jest dostępna z tego komputera, ale nie z sieci lokalnej.
    # Port na Macu zmienisz w .env (DB_HOST_PORT), np. gdy 5432 zajmuje inny projekt.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      # Tryb deweloperski: obraz zawiera też pytest i ruff (docker compose exec backend pytest).
      args:
        REQUIREMENTS: requirements-dev.txt
    restart: unless-stopped
    # Wszystkie ustawienia aplikacji (DATABASE_URL, JWT, AI) pochodzą z .env.
    # Wewnątrz sieci Dockera baza jest pod adresem db:5432 (nazwa usługi, nie localhost).
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    # Start: start.sh wykonuje migracje (alembic upgrade head), potem uruchamia serwer.
    # Tryb deweloperski: kod z dysku jest podmontowany do kontenera, a --reload
    # restartuje serwer po każdym zapisie pliku (bez przebudowy obrazu).
    volumes:
      - ./backend:/app
    command: ["sh", "start.sh", "--reload", "--reload-dir", "app"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Adres API używany przez przeglądarkę, czyli port z komputera, a nie nazwa usługi w Dockerze.
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend
    # Port stały: tylko ten adres (http://localhost:5173) jest dopuszczony przez CORS w backendzie.
    ports:
      - "127.0.0.1:5173:5173"
    # Tryb deweloperski: kod z dysku jest podmontowany, a Vite odświeża stronę po zapisie pliku.
    # Osobny wolumen na node_modules: w kontenerze są pakiety dla Linuksa, a na Macu dla macOS,
    # więc katalog z dysku nie może ich przykryć. Po zmianie zależności: docker compose up --build -V
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
