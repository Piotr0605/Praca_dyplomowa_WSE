# Zmienne ${...} Compose czyta automatycznie z pliku .env w katalogu projektu.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Tylko 127.0.0.1: baza jest dostępna z tego komputera, ale nie z sieci lokalnej.
    # Port na Macu zmienisz w .env (DB_HOST_PORT), np. gdy 5432 zajmuje inny projekt.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
