# Konfiguracja Alembic (migracje schematu bazy danych).
# Adres bazy NIE jest tu wpisany: env.py bierze go z DATABASE_URL (plik .env),
# więc hasło nie trafia do repozytorium, a aplikacja i migracje zawsze łączą się z tą samą bazą.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Nazwy plików migracji z datą, np. 20261103_1530_a1b2c3d4_utworzenie_tabeli_users.py,
# żeby w katalogu versions/ było widać kolejność i czas powstania zmian.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
